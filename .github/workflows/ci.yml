name: CI

on:
  push:
    branches: [main]
  pull_request:

# Gate que protege o deploy mesmo se o hook de pre-commit (husky) for burlado.
# Não precisa de segredos: o client Supabase degrada sem env (placeholder).
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:run
      - run: npm run build
